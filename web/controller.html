<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pong Controller</title>
  <style>
	body { margin: 0; height: 100vh; display: grid; place-items: center; text-align: center;
		   background: #111; color: #eee; font-family: sans-serif; }
	a { color: #8cf; }
  </style>
</head>
<body>
  <div>
	<h1 id="status">Connecting...</h1>
	<a id="cert-link" style="display:none">Can't reach the game. Tap here to trust its certificate, then come back and reload.</a>
  </div>
  <script>
    const status = document.getElementById("status");
    const certLink = document.getElementById("cert-link");
    const ws = new WebSocket("wss://" + location.hostname + ":8444");
    ws.onopen = () => {
      status.textContent = "Connected to Pong";
      ws.send(JSON.stringify({ type: "hello" }));
    };
    ws.onclose = () => { status.textContent = "Disconnected"; };
    ws.onerror = () => {
      certLink.href = "https://" + location.hostname + ":8444";
      certLink.style.display = "block";
    };
  </script>
</body>
</html>
